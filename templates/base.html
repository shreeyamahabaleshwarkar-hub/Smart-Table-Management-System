<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Smart Table{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <header class="site-header">
        <a href="{{ url_for('home') }}" class="brand">
            smarttable<span>.</span>
        </a>

        <div class="table-label">TABLE 04</div>
    </header>

    <main class="page-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        A simpler way to dine.
    </footer>

    <script
        src="{{ url_for('static', filename='script.js') }}"
    ></script>
</body>
</html>
